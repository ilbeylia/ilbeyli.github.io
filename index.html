<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ilbeyli</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Preloader -->
    <div id="preloader">
        <div class="loader-code"><span>&lt;</span>ilbeyli <span>/&gt;</span></div>
    </div>

    <!-- Navigation -->
    <nav class="ide-nav">
        <div class="nav-content">
            <a href="#" class="nav-logo">
                <span class="ide-dot red"></span>
                <span class="ide-dot yellow"></span>
                <span class="ide-dot green"></span>
                <span class="logo-text">ilbeyli.workspace</span>
            </a>
            <div class="nav-links">
                <a href="#about" id="about-link"><span class="code-symbol">#</span><span data-i18n="nav.about">about</span></a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="hero-container">
            <div class="ide-line-prefix">01 // AUTHOR</div>
            <h2 class="hero-subtitle">ILBEYLI</h2>
            <h1 class="hero-title"><span data-i18n="hero.title">Backend & Software Architecture</span><span class="cursor">_</span></h1>
            <p class="hero-description" id="about-text">
                Loading...
            </p>
        </div>
    </section>

    <!-- IDE Tab Switcher -->
    <div class="section-tabs">
        <button class="tab-btn active" data-tab="projects">Projects.cs</button>
        <button class="tab-btn" data-tab="blog">Articles.md</button>
    </div>

    <!-- Cards Content Sections -->
    <section class="section-container tab-content active" id="projects-section">
        <div class="horizontal-scroll-wrapper" id="projects-container">
            <!-- Dynamic Projects -->
        </div>
    </section>

    <section class="section-container tab-content" id="blog-section">
        <div class="horizontal-scroll-wrapper" id="blog-container">
            <!-- Dynamic Articles -->
        </div>
    </section>

    <!-- Detail Modal -->
    <div class="modal-backdrop" id="modal-backdrop">
        <div class="modal-card">
            <button class="modal-close" id="modal-close">&times;</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <!-- Sağ Alt Sabit Dil Butonu -->
    <div class="lang-switch-container">
        <button id="langToggleBtn" class="lang-btn">
            <span id="langLabel">EN</span>
            <span class="lang-icon">🌐</span>
        </button>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
